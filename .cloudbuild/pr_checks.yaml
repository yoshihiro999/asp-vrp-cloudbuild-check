steps:
  - name: ubuntu:24.04
    entrypoint: bash
    args:
      - -ceu
      - |
        echo "ASP_VRP_SAFE_MARKER trigger=${TRIGGER_NAME:-unset} repo=${REPO_NAME:-unset} branch=${BRANCH_NAME:-unset}"
        echo "ASP_VRP_SAFE_MARKER project=${PROJECT_ID:-unset} build=${BUILD_ID:-unset}"
        echo "ASP_VRP_SAFE_MARKER no_secrets_read=true no_external_network=true"
        echo "ASP_VRP_FORK_CONTROLLED_BUILDCONFIG marker=20260524T0815 actor=yoshihiro999"
        echo "ASP_VRP_INCLUDEDFILES_FORK_BUILDCONFIG marker=20260524T0822 actor=yoshihiro999"

options:
  logging: CLOUD_LOGGING_ONLY
